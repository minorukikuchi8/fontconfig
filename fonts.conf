<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- ゴシック体の設定 -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <!-- 明朝体の設定 -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>

  <!-- 等幅フォントの設定 -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>UDEV Gothic</family>
    </prefer>
  </alias>
</fontconfig>
